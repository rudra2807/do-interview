name: do-interview
region: nyc
services:
  - name: api
    github:
      repo: rudra2807/do-interview
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    health_check:
      http_path: /health
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: PORT
        scope: RUN_TIME
        value: "3000"
databases:
  - name: db
    engine: PG
    production: false
